name: Deal Catalog Research Export
on:
  workflow_dispatch:
    inputs:
      export_data:
        description: 'Transfer product research data only after explicit user approval'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Export public product identities only
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          PHP_BIN: ${{ secrets.SERVER_PHP_BIN }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          EXPORT_DATA: ${{ inputs.export_data }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          port="${SERVER_PORT:-22}"
          server_path="${SERVER_PATH:-/var/www/h209767/data/www/new.kotlov.by}"
          php_bin="${PHP_BIN:-/opt/alt/php83/usr/bin/php}"
          ssh-keyscan -p "$port" "$SERVER_HOST" >> ~/.ssh/known_hosts
          scp -q -i ~/.ssh/server_key -P "$port" scripts/export_deal_research.php "$SERVER_USER@$SERVER_HOST:$server_path/storage/app/private/deal-by/research-export.php"
          ssh -i ~/.ssh/server_key -p "$port" "$SERVER_USER@$SERVER_HOST" "cd '$server_path' && '$php_bin' storage/app/private/deal-by/research-export.php"
          if [[ "$EXPORT_DATA" == "true" ]]; then
            mkdir -p research
            scp -q -i ~/.ssh/server_key -P "$port" "$SERVER_USER@$SERVER_HOST:$server_path/storage/app/private/deal-by/research/*.ndjson" research/
            scp -q -i ~/.ssh/server_key -P "$port" "$SERVER_USER@$SERVER_HOST:$server_path/storage/app/private/deal-by/research/baseline-plan.json" research/
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.export_data
        with:
          name: deal-product-research
          path: research/
          retention-days: 7
