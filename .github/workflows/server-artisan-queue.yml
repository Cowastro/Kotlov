name: Server Artisan Queue

on:
  push:
    branches:
      - main
    paths:
      - .github/server-artisan-task.json

permissions:
  contents: write

concurrency:
  group: server-artisan-queue
  cancel-in-progress: false

jobs:
  run:
    name: Run Queued Server Artisan Task
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve task
        id: task
        run: |
          set -euo pipefail

          task="$(jq -r '.task // ""' .github/server-artisan-task.json)"
          artisan_args="$(jq -r '.artisan_args // ""' .github/server-artisan-task.json)"
          log_file="$(jq -r '.log_file // "storage/logs/server-artisan.log"' .github/server-artisan-task.json)"

          case "$task" in
            optimize-clear|artisan-dry-run|artisan-apply|artisan-background|tail-log|ps-artisan|health-check|kill-pid) ;;
            *) echo "::error::Unsupported task: $task"; exit 1 ;;
          esac

          if [[ "$artisan_args" == *$'\n'* || "$log_file" == *$'\n'* ]]; then
            echo "::error::Inputs must be single-line."
            exit 1
          fi

          if [[ "$artisan_args" =~ [\'\"\`\;\|\&\<\>\\] || "$log_file" =~ [\'\"\`\;\|\&\<\>\\] ]]; then
            echo "::error::Shell control characters are not allowed in inputs."
            exit 1
          fi

          if [[ "$task" == "artisan-dry-run" && "$artisan_args" == *"--apply"* ]]; then
            echo "::error::artisan-dry-run cannot contain --apply."
            exit 1
          fi

          if [[ "$task" == artisan-* && -z "${artisan_args// }" ]]; then
            echo "::error::artisan_args is required for artisan tasks."
            exit 1
          fi

          normalized_args="${artisan_args,,}"
          if [[ "$normalized_args" == *"@"* || "$normalized_args" =~ --(email|phone|address|customer|client|contact|name)= ]]; then
            echo "::error::Personal-data arguments are forbidden in GitHub Actions. Run this diagnostic directly on the server."
            exit 1
          fi

          if [[ "$task" == "tail-log" && "$log_file" != storage/logs/* ]]; then
            echo "::error::tail-log is limited to storage/logs/*."
            exit 1
          fi

          if [[ "$task" == "kill-pid" && ! "$artisan_args" =~ ^[0-9][0-9\ ]*$ ]]; then
            echo "::error::kill-pid accepts only numeric process IDs."
            exit 1
          fi

          {
            echo "TASK=$task"
            echo "ARTISAN_ARGS=$artisan_args"
            echo "LOG_FILE=$log_file"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          ssh-keyscan -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Run remote task
        id: remote
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          PHP_BIN: ${{ secrets.SERVER_PHP_BIN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL: ${{ secrets.OPENAI_API_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          set -euo pipefail

          port="${SERVER_PORT:-22}"
          php_bin="${PHP_BIN:-/opt/alt/php83/usr/bin/php}"
          server_path="${SERVER_PATH:-/var/www/h209767/data/www/new.kotlov.by}"
          output_file="$RUNNER_TEMP/server-artisan-output.txt"

          remote_script=$(cat <<'SCRIPT'
          set -euo pipefail
          cd "$SERVER_PATH"
          IFS=' ' read -r -a ARTISAN_ARGV <<< "$ARTISAN_ARGS"
          for i in "${!ARTISAN_ARGV[@]}"; do
            ARTISAN_ARGV[$i]="${ARTISAN_ARGV[$i]//%20/ }"
          done

          detail_log="storage/logs/github-actions-${TASK}.log"
          mkdir -p "$(dirname "$detail_log")"

          # Keep complete diagnostic output on the host. The workflow receives
          # only aggregates, never log messages, HTTP headers or process lines.
          set +e
          (
            set -euo pipefail
            # Keep production media directories in place. Stash tracked edits
            # only; ignored media must stay put.
            git stash push -m "pre-artisan-queue-$(date +%Y%m%d%H%M%S)" || true
            git pull --ff-only
            git checkout -- public/icons

            case "$TASK" in
              optimize-clear)
                "$PHP_BIN" artisan optimize:clear
                ;;
              artisan-dry-run|artisan-apply)
                "$PHP_BIN" artisan "${ARTISAN_ARGV[@]}"
                ;;
              artisan-background)
                mkdir -p "$(dirname "$LOG_FILE")"
                nohup "$PHP_BIN" artisan "${ARTISAN_ARGV[@]}" > "$LOG_FILE" 2>&1 &
                echo "background_started=1"
                ;;
              tail-log)
                test -f "$LOG_FILE"
                echo "source_lines=$(wc -l < "$LOG_FILE" | tr -d ' ')"
                echo "source_bytes=$(wc -c < "$LOG_FILE" | tr -d ' ')"
                echo "source_errors=$(grep -Eic 'error|exception|failed|critical' "$LOG_FILE" || true)"
                echo "source_warnings=$(grep -Eic 'warning|warn' "$LOG_FILE" || true)"
                ;;
              ps-artisan)
                echo "artisan_processes=$(pgrep -fc '[a]rtisan' || true)"
                ;;
              health-check)
                curl --fail --silent --show-error --output /dev/null --max-time 15 https://kotlov.by/
                echo | openssl s_client -connect kotlov.by:443 -servername kotlov.by 2>/dev/null | openssl x509 -noout -dates
                curl --fail --silent --show-error --output /dev/null --max-time 15 -H "Host: kotlov.by" http://127.0.0.1/
                ;;
              kill-pid)
                kill "${ARTISAN_ARGV[@]}" || true
                echo "artisan_processes_after=$(pgrep -fc '[a]rtisan' || true)"
                ;;
            esac
          ) > "$detail_log" 2>&1
          status=$?
          set -e

          echo "task=$TASK"
          echo "status=$status"
          echo "output_lines=$(wc -l < "$detail_log" | tr -d ' ')"
          echo "output_bytes=$(wc -c < "$detail_log" | tr -d ' ')"
          echo "error_lines=$(grep -Eic 'error|exception|failed|critical' "$detail_log" || true)"
          echo "warning_lines=$(grep -Eic 'warning|warn' "$detail_log" || true)"
          echo "detail_log=$detail_log"
          exit "$status"
          SCRIPT
          )

          set +e
          ssh -i ~/.ssh/server_key -p "$port" "$SERVER_USER@$SERVER_HOST" \
            "TASK='$TASK' ARTISAN_ARGS='$ARTISAN_ARGS' LOG_FILE='$LOG_FILE' SERVER_PATH='$server_path' PHP_BIN='$php_bin' OPENAI_API_KEY='$OPENAI_API_KEY' OPENAI_API_URL='$OPENAI_API_URL' OPENAI_MODEL='$OPENAI_MODEL' bash -s" \
            <<< "$remote_script" 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}
          set -e

          safe_summary="$(grep -E '^(task|status|output_lines|output_bytes|error_lines|warning_lines|detail_log)=[A-Za-z0-9_./-]+$' "$output_file" || true)"

          {
            echo "# Server Artisan Result"
            echo
            echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Task: \`$TASK\`"
            echo "- Exit code: \`$status\`"
            echo
            echo "Only aggregate diagnostics are stored here. Detailed output remains in the server-local log."
            echo
            echo '```text'
            printf '%s\n' "$safe_summary"
            echo '```'
          } > .github/server-artisan-result.md

          exit "$status"

      - name: Commit result
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/server-artisan-result.md
          git commit -m "Update server artisan result [skip ci]" || exit 0
          git push
