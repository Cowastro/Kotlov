      - name: Upload BelOMO audit artifact
        if: inputs.task == 'audit-belomo'
        uses: actions/upload-artifact@v6
        with:
          name: belomo-current-audit
          path: artifacts/belomo-current-audit.csv
          if-no-files-found: error
          retention-days: 7

      - name: Download gas meter demand audit
        if: inputs.task == 'audit-gas-meter-demand'
        env:
