      - name: Upload SVAH Group price list
        if: inputs.task == 'upload-svah-pricelist'
        env:
          SVAH_PRICELIST_XLSX_BASE64: ${{ secrets.SVAH_PRICELIST_XLSX_BASE64 }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          test -n "$SVAH_PRICELIST_XLSX_BASE64"

          port="${SERVER_PORT:-22}"
          server_path="${SERVER_PATH:-/var/www/h209767/data/www/new.kotlov.by}"
          local_file="$(mktemp)"
          trap 'rm -f "$local_file"' EXIT

          printf '%s' "$SVAH_PRICELIST_XLSX_BASE64" | base64 --decode > "$local_file"
          test "$(head -c 2 "$local_file")" = "PK"

          ssh -i ~/.ssh/server_key -p "$port" "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$server_path/storage/app/pricelists/svah-group'"
          scp -q -i ~/.ssh/server_key -P "$port" "$local_file" \
            "$SERVER_USER@$SERVER_HOST:$server_path/storage/app/pricelists/svah-group/latest.xlsx.upload"
          ssh -i ~/.ssh/server_key -p "$port" "$SERVER_USER@$SERVER_HOST" \
            "mv '$server_path/storage/app/pricelists/svah-group/latest.xlsx.upload' '$server_path/storage/app/pricelists/svah-group/latest.xlsx' && chmod 640 '$server_path/storage/app/pricelists/svah-group/latest.xlsx'"

          echo "uploaded=1"
          echo "destination=storage/app/pricelists/svah-group/latest.xlsx"

      - name: Configure OpenAI production secret
        if: inputs.task == 'configure-openai'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          PHP_BIN: ${{ secrets.SERVER_PHP_BIN }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"

          port="${SERVER_PORT:-22}"
          php_bin="${PHP_BIN:-/opt/alt/php83/usr/bin/php}"
          server_path="${SERVER_PATH:-/var/www/h209767/data/www/new.kotlov.by}"
          key_literal="$(printf '%q' "$OPENAI_API_KEY")"

          remote_script=$(cat <<'SCRIPT'
          set -euo pipefail
          cd "$SERVER_PATH"
          openai_key=__OPENAI_KEY_LITERAL__
          test -n "$openai_key"
          test -f .env

          umask 077
          temp_env="$(mktemp "$SERVER_PATH/.env.openai.XXXXXX")"
          cleanup() { rm -f "$temp_env"; }
          trap cleanup EXIT
          replaced=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" == OPENAI_API_KEY=* ]]; then
              printf 'OPENAI_API_KEY=%s\n' "$openai_key" >> "$temp_env"
              replaced=1
            else
              printf '%s\n' "$line" >> "$temp_env"
            fi
          done < .env
          if [[ "$replaced" -eq 0 ]]; then
            printf '\nOPENAI_API_KEY=%s\n' "$openai_key" >> "$temp_env"
          fi

          chmod --reference=.env "$temp_env" 2>/dev/null || chmod 600 "$temp_env"
          mv "$temp_env" .env
          trap - EXIT
          "$PHP_BIN" artisan optimize:clear >/dev/null
          echo 'openai_key_configured=1'
          SCRIPT
          )
          remote_script="${remote_script/__OPENAI_KEY_LITERAL__/$key_literal}"

          ssh -i ~/.ssh/server_key -p "$port" "$SERVER_USER@$SERVER_HOST" \
            "SERVER_PATH='$server_path' PHP_BIN='$php_bin' bash -s" \
            <<< "$remote_script"

      - name: Configure Deal.by production secret
        if: inputs.task == 'configure-deal-by'
        env:
          DEAL_BY_API_TOKEN: ${{ secrets.DEAL_BY_API_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          PHP_BIN: ${{ secrets.SERVER_PHP_BIN }}
        run: |
          set -euo pipefail
          test -n "$DEAL_BY_API_TOKEN"

          port="${SERVER_PORT:-22}"
          php_bin="${PHP_BIN:-/opt/alt/php83/usr/bin/php}"
          server_path="${SERVER_PATH:-/var/www/h209767/data/www/new.kotlov.by}"
          token_literal="$(printf '%q' "$DEAL_BY_API_TOKEN")"

          remote_script=$(cat <<'SCRIPT'
          set -euo pipefail
          cd "$SERVER_PATH"
          deal_by_token=__DEAL_BY_TOKEN_LITERAL__
          test -n "$deal_by_token"
          test -f .env

          umask 077
          temp_env="$(mktemp "$SERVER_PATH/.env.deal-by.XXXXXX")"
          cleanup() { rm -f "$temp_env"; }
          trap cleanup EXIT
          token_replaced=0
          enabled_replaced=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            case "$line" in
              DEAL_BY_API_TOKEN=*)
                printf 'DEAL_BY_API_TOKEN=%s\n' "$deal_by_token" >> "$temp_env"
                token_replaced=1
                ;;
              DEAL_BY_ORDERS_CAPTURE_ENABLED=*)
                printf 'DEAL_BY_ORDERS_CAPTURE_ENABLED=false\n' >> "$temp_env"
                enabled_replaced=1
                ;;
              *) printf '%s\n' "$line" >> "$temp_env" ;;
            esac
          done < .env
          if [[ "$token_replaced" -eq 0 ]]; then
            printf '\nDEAL_BY_API_TOKEN=%s\n' "$deal_by_token" >> "$temp_env"
          fi
          if [[ "$enabled_replaced" -eq 0 ]]; then
            printf 'DEAL_BY_ORDERS_CAPTURE_ENABLED=false\n' >> "$temp_env"
          fi

          chmod --reference=.env "$temp_env" 2>/dev/null || chmod 600 "$temp_env"
          mv "$temp_env" .env
          trap - EXIT
          "$PHP_BIN" artisan optimize:clear >/dev/null
          echo 'deal_by_token_configured=1'
          echo 'deal_by_orders_enabled=0'
          SCRIPT
          )
          remote_script="${remote_script/__DEAL_BY_TOKEN_LITERAL__/$token_literal}"

          ssh -i ~/.ssh/server_key -p "$port" "$SERVER_USER@$SERVER_HOST" \
            "SERVER_PATH='$server_path' PHP_BIN='$php_bin' bash -s" \
            <<< "$remote_script"

      - name: Download Teplodar audit report
        if: inputs.task == 'audit-teplodar'
