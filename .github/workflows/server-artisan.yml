          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          port="${SERVER_PORT:-22}"
          server_path="${SERVER_PATH:-/var/www/h209767/data/www/new.kotlov.by}"
          mkdir -p storage/app/private/market-price-research
          scp -i ~/.ssh/server_key -P "$port" \
            "$SERVER_USER@$SERVER_HOST:$server_path/storage/app/private/market-price-research/market-price-contexts.json" \
            storage/app/private/market-price-research/market-price-contexts.json

      - name: Setup PHP for market research
        if: inputs.task == 'research-price-batch'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          coverage: none

      - name: Install market research runtime
        if: inputs.task == 'research-price-batch'
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate

      - name: Research production market prices
        if: inputs.task == 'research-price-batch'
        env:
          ARTISAN_ARGS: ${{ inputs.artisan_args }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MARKET_RESEARCH_PROVIDER: openai
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          IFS=' ' read -r -a ARTISAN_ARGV <<< "$ARTISAN_ARGS"
          for i in "${!ARTISAN_ARGV[@]}"; do
            ARTISAN_ARGV[$i]="${ARTISAN_ARGV[$i]//%20/ }"
          done
          php artisan catalog:build-market-price-batch "${ARTISAN_ARGV[@]}" \
            --input-contexts=storage/app/private/market-price-research/market-price-contexts.json \
            --output=storage/app/private/market-price-research/market-price-research-batch.json

      - name: Upload market price research batch
        if: always() && inputs.task == 'research-price-batch'
        uses: actions/upload-artifact@v4
        with:
          name: market-price-research-batch
          path: storage/app/private/market-price-research/market-price-research-batch.json
          if-no-files-found: error
          retention-days: 7

      - name: Download unlinked-products audit report
        if: inputs.task == 'audit-unlinked-products'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          port="${SERVER_PORT:-22}"
          server_path="${SERVER_PATH:-/var/www/h209767/data/www/new.kotlov.by}"
          mkdir -p audit-artifacts
          scp -i ~/.ssh/server_key -P "$port" \
            "$SERVER_USER@$SERVER_HOST:$server_path/storage/app/reports/catalog/unlinked-products.csv" \
            audit-artifacts/unlinked-products.csv

      - name: Upload unlinked-products audit report
        if: inputs.task == 'audit-unlinked-products'
        uses: actions/upload-artifact@v4
        with:
          name: unlinked-products-audit
          path: audit-artifacts/unlinked-products.csv
          if-no-files-found: error
          retention-days: 7

      - name: Download procurement-safe market research queue
        if: inputs.task == 'audit-price-integrity'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          port="${SERVER_PORT:-22}"
          server_path="${SERVER_PATH:-/var/www/h209767/data/www/new.kotlov.by}"
          mkdir -p audit-artifacts
          scp -i ~/.ssh/server_key -P "$port" \
            "$SERVER_USER@$SERVER_HOST:$server_path/storage/app/reports/catalog/price-research-queue.csv" \
            audit-artifacts/price-research-queue.csv

      - name: Upload procurement-safe market research queue
        if: inputs.task == 'audit-price-integrity'
        uses: actions/upload-artifact@v4
        with:
          name: price-research-queue
          path: audit-artifacts/price-research-queue.csv
          if-no-files-found: error
          retention-days: 7
