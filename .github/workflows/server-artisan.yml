name: Server Artisan

on:
  workflow_dispatch:
    inputs:
      task:
        description: Remote task to run
        required: true
        type: choice
        options:
          - optimize-clear
          - artisan-dry-run
          - artisan-apply
          - artisan-background
          - tail-log
          - diagnose-error-kinds
          - ps-artisan
          - stop-varmega-image-repair
          - stop-product-image-repair
          - audit-teplodar
          - audit-unlinked-products
          - audit-price-integrity
          - audit-svah-group
          - audit-belomo
          - audit-gas-meter-demand
          - verify-commercial-pdf
          - research-price-batch
          - upload-svah-pricelist
          - configure-openai
          - configure-deal-by
          - enable-deal-by-orders
          - deploy-safe
          - deploy-recover
      artisan_args:
        description: 'Artisan args, e.g. supplier:sync-ligmet --dry-run --brand=Blist. Use %20 for a space inside one value, e.g. --brand=Теплов%20и%20Сухов'
        required: false
        type: string
      log_file:
        description: Log file for background/tail tasks
        required: false
        default: storage/logs/server-artisan.log
        type: string

jobs:
  run:
    name: Run Server Artisan Task
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Validate inputs
        env:
          TASK: ${{ inputs.task }}
          ARTISAN_ARGS: ${{ inputs.artisan_args }}
          LOG_FILE: ${{ inputs.log_file }}
        run: |
          set -euo pipefail

          case "$TASK" in
            optimize-clear|artisan-dry-run|artisan-apply|artisan-background|tail-log|diagnose-error-kinds|ps-artisan|stop-varmega-image-repair|stop-product-image-repair|audit-teplodar|audit-unlinked-products|audit-price-integrity|audit-svah-group|audit-belomo|audit-gas-meter-demand|verify-commercial-pdf|research-price-batch|upload-svah-pricelist|configure-openai|configure-deal-by|enable-deal-by-orders|deploy-safe|deploy-recover) ;;
            *) echo "::error::Unsupported task: $TASK"; exit 1 ;;
          esac

          if [[ "$ARTISAN_ARGS" == *$'\n'* || "$LOG_FILE" == *$'\n'* ]]; then
            echo "::error::Inputs must be single-line."
            exit 1
          fi

          if [[ "$ARTISAN_ARGS" =~ [\'\"\`\;\|\&\<\>\\] || "$LOG_FILE" =~ [\'\"\`\;\|\&\<\>\\] ]]; then
            echo "::error::Shell control characters are not allowed in inputs."
            exit 1
          fi

          if [[ "$TASK" == "artisan-dry-run" && "$ARTISAN_ARGS" == *"--apply"* ]]; then
            echo "::error::artisan-dry-run cannot contain --apply."
            exit 1
          fi

          if [[ ("$TASK" == artisan-* || "$TASK" == "research-price-batch") && -z "${ARTISAN_ARGS// }" ]]; then
            echo "::error::artisan_args is required for artisan tasks."
            exit 1
          fi

          normalized_args="${ARTISAN_ARGS,,}"
          if [[ "$normalized_args" == *"@"* || "$normalized_args" =~ --(email|phone|address|customer|client|contact|name)= ]]; then
            echo "::error::Personal-data arguments are forbidden in GitHub Actions. Run this diagnostic directly on the server."
            exit 1
          fi

          if [[ "$TASK" == "tail-log" && "$LOG_FILE" != storage/logs/* ]]; then
            echo "::error::tail-log is limited to storage/logs/*."
            exit 1
          fi

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          ssh-keyscan -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Checkout code for market research
        if: inputs.task == 'research-price-batch'
        uses: actions/checkout@v6

      - name: Run remote task
        if: inputs.task != 'configure-openai' && inputs.task != 'configure-deal-by' && inputs.task != 'upload-svah-pricelist'
        env:
          TASK: ${{ inputs.task }}
          ARTISAN_ARGS: ${{ inputs.artisan_args }}
          LOG_FILE: ${{ inputs.log_file }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          PHP_BIN: ${{ secrets.SERVER_PHP_BIN }}
        run: |
          set -euo pipefail

          port="${SERVER_PORT:-22}"
          php_bin="${PHP_BIN:-/opt/alt/php83/usr/bin/php}"
          server_path="${SERVER_PATH:-/var/www/h209767/data/www/new.kotlov.by}"

          remote_script=$(cat <<'SCRIPT'
          set -euo pipefail
          cd "$SERVER_PATH"

          # ARTISAN_ARGS is a single flat string; splitting it unquoted on
          # whitespace is what turns "--dry-run --brand=X" into separate argv
          # entries, but the same split corrupts any value containing a real
          # space (e.g. --brand=Теплов и Сухов -> 3 broken tokens). Quoting
          # ARTISAN_ARGS itself isn't an option (quote characters are already
          # blocked at the workflow-input validation step, to keep the SSH
          # command line injection-safe). Instead, split on real whitespace
          # first, then restore literal %20 -> space per-token — so a caller
          # who needs a space inside one value writes it as %20.
          IFS=' ' read -r -a ARTISAN_ARGV <<< "$ARTISAN_ARGS"
          for i in "${!ARTISAN_ARGV[@]}"; do
            ARTISAN_ARGV[$i]="${ARTISAN_ARGV[$i]//%20/ }"
          done

          detail_log="storage/logs/github-actions-${TASK}.log"
          mkdir -p "$(dirname "$detail_log")"

          # Full output stays on the production host. GitHub Actions receives
          # only numeric aggregates and a server-local diagnostic path, so a
          # command or Laravel log cannot publish customer data or secrets.
          set +e
          (
            set -euo pipefail
            case "$TASK" in
              optimize-clear)
                git pull
                git checkout -- public/icons
                "$PHP_BIN" artisan optimize:clear
                ;;
              enable-deal-by-orders)
                test -f .env
                umask 077
                temp_env="$(mktemp "$SERVER_PATH/.env.deal-by.XXXXXX")"
                cleanup() { rm -f "$temp_env"; }
                trap cleanup EXIT
                replaced=0
                while IFS= read -r line || [[ -n "$line" ]]; do
                  if [[ "$line" == DEAL_BY_ORDERS_CAPTURE_ENABLED=* ]]; then
                    printf 'DEAL_BY_ORDERS_CAPTURE_ENABLED=true\n' >> "$temp_env"
                    replaced=1
                  else
                    printf '%s\n' "$line" >> "$temp_env"
                  fi
                done < .env
                if [[ "$replaced" -eq 0 ]]; then
                  printf '\nDEAL_BY_ORDERS_CAPTURE_ENABLED=true\n' >> "$temp_env"
                fi
                chmod --reference=.env "$temp_env" 2>/dev/null || chmod 600 "$temp_env"
                mv "$temp_env" .env
                trap - EXIT
                "$PHP_BIN" artisan optimize:clear >/dev/null
                echo 'deal_by_orders_enabled=1'
                ;;
              artisan-dry-run|artisan-apply)
                "$PHP_BIN" artisan "${ARTISAN_ARGV[@]}"
                ;;
              artisan-background)
                mkdir -p "$(dirname "$LOG_FILE")"
                nohup "$PHP_BIN" artisan "${ARTISAN_ARGV[@]}" > "$LOG_FILE" 2>&1 &
                echo "background_started=1"
                ;;
              tail-log)
                test -f "$LOG_FILE"
                echo "source_lines=$(wc -l < "$LOG_FILE" | tr -d ' ')"
                echo "source_bytes=$(wc -c < "$LOG_FILE" | tr -d ' ')"
                echo "source_errors=$(grep -Eic 'error|exception|failed|critical' "$LOG_FILE" || true)"
                echo "source_warnings=$(grep -Eic 'warning|warn' "$LOG_FILE" || true)"
                ;;
              diagnose-error-kinds)
                test -f storage/logs/laravel.log
                # Last 200 log lines, kept in a variable: only counts and a line number are printed.
                recent_log="$(awk '{line[NR % 200] = $0} END {for (i = NR - 199; i <= NR; i++) if (i > 0) print line[i % 200]}' storage/logs/laravel.log)"
                echo "parse_errors=$(grep -Eic 'ParseError|syntax error|unexpected token' <<< "$recent_log" || true)"
                echo "view_errors=$(grep -Eic 'ViewException|chimney-selector' <<< "$recent_log" || true)"
                echo "type_errors=$(grep -Eic 'TypeError|ArgumentCountError' <<< "$recent_log" || true)"
                echo "memory_errors=$(grep -Eic 'allowed memory size|memory exhausted|out of memory' <<< "$recent_log" || true)"
                echo "undefined_errors=$(grep -Eic 'undefined (variable|property|method)|call to undefined' <<< "$recent_log" || true)"
                echo "database_errors=$(grep -Eic 'SQLSTATE|QueryException' <<< "$recent_log" || true)"
                latest_parse="$(grep -E 'ParseError|syntax error|unexpected token|Unclosed [\[({]' <<< "$recent_log" | awk 'END {print}' || true)"
                echo "parse_line=$(sed -nE 's/.* on line ([0-9]+).*/\1/p' <<< "$latest_parse" | awk 'END {print}')"
                echo "unexpected_end=$(grep -Eic 'unexpected (end of file|token .end)' <<< "$latest_parse" || true)"
                echo "unclosed_delimiter=$(grep -Eic 'Unclosed [\[({]' <<< "$latest_parse" || true)"
                echo "unexpected_identifier=$(grep -Eic 'unexpected (identifier|variable|string content)' <<< "$latest_parse" || true)"
                echo "unexpected_closer=$(grep -Eic 'unexpected token .[)}\]].' <<< "$latest_parse" || true)"
                echo "unexpected_separator=$(grep -Eic 'unexpected token .[,;:].' <<< "$latest_parse" || true)"
                echo "unexpected_blade_end=$(grep -Eic 'unexpected token .(endif|endforeach|endfor|endswitch|endsection|endpush).' <<< "$latest_parse" || true)"
                ;;
              ps-artisan)
                echo "artisan_processes=$(pgrep -fc '[a]rtisan' || true)"
                ;;
              stop-varmega-image-repair)
                pkill -f 'artisan catalog:repair-product-images --brand=Varmega' || true
                echo "artisan_processes_after=$(pgrep -fc '[a]rtisan' || true)"
                ;;
              stop-product-image-repair)
                pkill -f 'artisan catalog:repair-product-images' || true
                echo "artisan_processes_after=$(pgrep -fc '[a]rtisan' || true)"
                ;;
              audit-teplodar)
                "$PHP_BIN" artisan supplier:audit-teplodar-bania \
                  --output=storage/app/reports/bania/teplodar-bania-audit.csv
                ;;
              audit-unlinked-products)
                "$PHP_BIN" artisan catalog:audit-unlinked-products \
                  --active-only \
                  --operational-only \
                  --output=storage/app/reports/catalog/unlinked-products.csv
                ;;
              audit-price-integrity)
                "$PHP_BIN" artisan catalog:audit-price-integrity \
                  --stale-hours=24 \
                  --output=storage/app/private/catalog-price-audit.csv \
                  --research-output=storage/app/reports/catalog/price-research-queue.csv
                ;;
              audit-svah-group)
                "$PHP_BIN" artisan supplier:sync-svah-group \
                  --dry-run \
                  --report=storage/app/reports/suppliers/svah-group/current-audit.csv
                ;;
              audit-belomo)
                "$PHP_BIN" artisan supplier:sync-belomo-pricelist \
                  --dry-run \
                  --sync-retail-prices \
                  --report=storage/app/reports/suppliers/belomo/current-audit.csv
                ;;
              audit-gas-meter-demand)
                "$PHP_BIN" artisan orders:audit-gas-meter-demand \
                  --days=365 \
                  --report=storage/app/reports/suppliers/belomo/gas-meter-demand.csv
                ;;
              verify-commercial-pdf)
                "$PHP_BIN" artisan commercial-documents:verify-pdf "${ARTISAN_ARGV[@]}"
                ;;
              research-price-batch)
                "$PHP_BIN" artisan catalog:build-market-price-batch "${ARTISAN_ARGV[@]}" \
                  --export-contexts=storage/app/private/market-price-research/market-price-contexts.json
                ;;
              deploy-safe)
              # Never discard production changes. A dirty tracked worktree is a
              # hard stop so an operator can inspect and preserve it first. The
              # Teplodvor index is runtime data: it may stay dirty, and Git will
              # still refuse the pull if an incoming commit touches that file.
              tracked_changes="$(git status --porcelain --untracked-files=no)"
              # `.htaccess` may be maintained by the hosting provider for an
              # emergency traffic/geo restriction. Preserve it just like the
              # runtime Teplodvor index unless an incoming commit touches it.
              unexpected_changes="$(printf '%s\n' "$tracked_changes" | grep -vE '^ M (storage/teplodvor_index\.json|\.htaccess)$' || true)"
              if [[ -n "$unexpected_changes" ]]; then
                echo "::error::Deployment stopped: tracked server files contain local changes."
                printf '%s\n' "$unexpected_changes"
                exit 1
              fi
              if [[ -n "$tracked_changes" ]]; then
                echo "Preserving approved server-managed tracked files."
                printf '%s\n' "$tracked_changes"
              fi

              current_branch="$(git branch --show-current)"
              if [[ "$current_branch" != "main" ]]; then
                echo "::error::Deployment stopped: expected branch main, found $current_branch."
                exit 1
              fi

              # Fast-forward only: refuse divergent history and never create a
              # merge commit on the production checkout.
              echo "deploy.stage=git"
              git pull --ff-only origin main
              composer_bin="$(command -v composer || true)"
              if [[ -z "$composer_bin" ]]; then
                echo "::error::Deployment stopped: Composer is not installed on the server."
                exit 1
              fi
              echo "deploy.stage=composer"
              COMPOSER_ALLOW_SUPERUSER=1 COMPOSER_DISCARD_CHANGES=1 "$composer_bin" install \
                --no-dev \
                --no-interaction \
                --no-scripts \
                --prefer-dist \
                --optimize-autoloader
              echo "deploy.stage=package-discover"
              "$PHP_BIN" artisan package:discover --ansi
              echo "deploy.stage=migrate"
              "$PHP_BIN" artisan migrate --force
              echo "deploy.stage=optimize"
              "$PHP_BIN" artisan optimize:clear
              echo "deploy.stage=complete"
                ;;
              deploy-recover)
                git merge --abort || true
                git pull --ff-only
                git checkout -- public/icons
                "$PHP_BIN" artisan optimize:clear
                ;;
            esac
          ) > "$detail_log" 2>&1
          status=$?
          set -e

          echo "task=$TASK"
          echo "status=$status"
          echo "output_lines=$(wc -l < "$detail_log" | tr -d ' ')"
          echo "output_bytes=$(wc -c < "$detail_log" | tr -d ' ')"
          echo "error_lines=$(grep -Eic 'error|exception|failed|critical' "$detail_log" || true)"
          echo "warning_lines=$(grep -Eic 'warning|warn' "$detail_log" || true)"
          echo "detail_log=$detail_log"
          if [[ "$TASK" == "diagnose-error-kinds" ]]; then
            grep -E '^(parse_errors|view_errors|type_errors|memory_errors|undefined_errors|database_errors|parse_line|unexpected_end|unclosed_delimiter|unexpected_identifier|unexpected_closer|unexpected_separator|unexpected_blade_end)=[0-9]*$' "$detail_log" || true
          fi
          if [[ "$TASK" == "deploy-safe" && "$status" -ne 0 ]]; then
            echo "safe_deploy_diagnostic_begin"
            # Keep deployment diagnostics aggregate-only. Raw output can contain
            # customer data, credentials or URLs even after best-effort redaction.
            echo "git_failure_lines=$(grep -Eic '(^|[[:space:]])(fatal:|error:)|git.*(failed|failure)' "$detail_log" || true)"
            echo "composer_failure_lines=$(grep -Eic 'composer.*(error|failed|failure)|requirements could not be resolved' "$detail_log" || true)"
            echo "migration_failure_lines=$(grep -Eic 'SQLSTATE|migration.*(failed|failure)|QueryException' "$detail_log" || true)"
            echo "permission_failure_lines=$(grep -Eic 'permission denied|operation not permitted|not writable|cannot write' "$detail_log" || true)"
            echo "network_failure_lines=$(grep -Eic 'curl error|connection timed out|could not resolve|could not authenticate|network' "$detail_log" || true)"
            echo "platform_failure_lines=$(grep -Eic 'requires php|platform requirements|does not satisfy that requirement' "$detail_log" || true)"
            echo "script_failure_lines=$(grep -Eic 'script .* returned with error|post-autoload-dump|post-update-cmd|could not open input file' "$detail_log" || true)"
            echo "memory_failure_lines=$(grep -Eic 'allowed memory size|out of memory|memory exhausted' "$detail_log" || true)"
            grep -Ei 'error|exception|failed|critical' "$detail_log" \
              | head -n 5 \
              | sed -E \
                  -e 's#https?://[^[:space:]]+#<url>#g' \
                  -e 's#(^|[[:space:]])/[^[:space:]]+#\\1<path>#g' \
                  -e 's#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+#<email>#g' \
                  -e 's#[A-Za-z0-9_-]{24,}#<redacted>#g' \
                  -e 's#^#safe_deploy_error=#' \
              || true
            grep -B 8 -A 2 -F 'Install of symfony/polyfill-php80 failed' "$detail_log" \
              | sed -E \
                  -e 's#https?://[^[:space:]]+#<url>#g' \
                  -e 's#(^|[[:space:]])/[^[:space:]]+#\\1<path>#g' \
                  -e 's#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+#<email>#g' \
                  -e 's#[A-Za-z0-9_-]{24,}#<redacted>#g' \
                  -e 's#^#safe_composer_context=#' \
              || true
            grep -E '^deploy\.stage=(git|composer|package-discover|migrate|optimize|complete)$' "$detail_log" || true
            echo "safe_deploy_diagnostic_end"
          fi
          if [[ "$TASK" == "verify-commercial-pdf" ]]; then
            echo "safe_diagnostic_output_begin"
            cat "$detail_log"
            echo "safe_diagnostic_output_end"
          fi
          if [[ "$TASK" == "audit-price-integrity" ]]; then
            echo "safe_price_metrics_begin"
            grep '^metric\.' "$detail_log" || true
            echo "safe_price_metrics_end"
          fi
          if [[ "$TASK" == "artisan-dry-run" && "${ARTISAN_ARGV[0]:-}" == "catalog:audit-price-integrity" ]]; then
            echo "safe_price_metrics_begin"
            grep '^metric\.' "$detail_log" || true
            echo "safe_price_metrics_end"
          fi
          if [[ ( "$TASK" == "artisan-dry-run" || "$TASK" == "artisan-apply" ) && "${ARTISAN_ARGV[0]:-}" == "supplier:sync-azbuka-tepla" ]]; then
            echo "safe_azbuka_tepla_metrics_begin"
            grep -E '^metric\.azbuka_tepla\.[a-z_]+=[0-9]+$' "$detail_log" || true
            echo "safe_azbuka_tepla_metrics_end"
          fi
          if [[ ( "$TASK" == "artisan-dry-run" || "$TASK" == "artisan-apply" ) && "${ARTISAN_ARGV[0]:-}" == "supplier:merge-sanbusinessgroup" ]]; then
            echo "safe_sbg_merge_metrics_begin"
            grep -E '^metric\.sbg_merge\.[a-z_]+=[0-9]+$' "$detail_log" || true
            echo "safe_sbg_merge_metrics_end"
          fi
          if [[ ( "$TASK" == "artisan-dry-run" || "$TASK" == "artisan-apply" ) && "${ARTISAN_ARGV[0]:-}" == "catalog:publish-tenko-thermokraft" ]]; then
            echo "safe_tenko_metrics_begin"
            grep -E '^metric\.tenko\.[a-z_]+=[0-9]+$' "$detail_log" || true
            echo "safe_tenko_metrics_end"
          fi
          if [[ ( "$TASK" == "artisan-dry-run" || "$TASK" == "artisan-apply" ) && "${ARTISAN_ARGV[0]:-}" == "catalog:apply-ecokamin-october-sale" ]]; then
            echo "safe_ecokamin_sale_metrics_begin"
            grep -E '^metric\.ecokamin_sale\.[a-z_]+=[0-9]+$' "$detail_log" || true
            grep -E '^audit\.ecokamin_sale\.(item|part)=[0-9]+:[a-z0-9._(),-]+(:[0-9]+:[0-9]+:[0-9]+:(new|active|off))?$' "$detail_log" || true
            echo "safe_ecokamin_sale_metrics_end"
          fi
          if [[ ( "$TASK" == "artisan-dry-run" || "$TASK" == "artisan-apply" || "$TASK" == "artisan-background" ) && "${ARTISAN_ARGV[0]:-}" == "catalog:publish-atmos-cards" ]]; then
            echo "safe_atmos_cards_metrics_begin"
            grep -E '^metric\.atmos_cards\.[a-z_]+=[0-9]+$' "$detail_log" || true
            grep -E '^audit\.atmos_cards\.error=[^:[:space:]]+:[A-Za-z]+:[0-9]+$' "$detail_log" || true
            grep -E '^audit\.atmos_cards\.item=[0-9]+:[a-z]+:[0-9]+:[a-z0-9-]+$' "$detail_log" | sort | uniq -c | awk '{print $2}' | sed -E 's/^audit\.atmos_cards\.item=([0-9]+):([a-z]+):[0-9]+:/audit.atmos_cards.group=\1:\2:/' | sort | uniq -c | sed -E 's/^ *([0-9]+) (.*)$/\2:\1/' || true
            echo "safe_atmos_cards_metrics_end"
          fi
          if [[ "${ARTISAN_ARGV[0]:-}" == "integration:onec-duplicates" ]]; then
            echo "safe_onec_duplicates_begin"
            grep -E '^metric\.onec_duplicates\.[a-z_]+=[0-9]+$' "$detail_log" || true
            grep -E '^audit\.onec_duplicates\.(pair=[0-9]+:[a-z0-9-]+:[0-9.]+:[0-9]+:[a-z0-9-]+:[0-9.]+:[01]|ambiguous=[0-9]+:[a-z0-9-]+:[0-9,]+)$' "$detail_log" || true
            echo "safe_onec_duplicates_end"
          fi
          if [[ "${ARTISAN_ARGV[0]:-}" == "integration:audit-onec-cards" ]]; then
            echo "safe_onec_cards_begin"
            grep -E '^metric\.onec_cards\.[a-z_]+=[0-9]+$' "$detail_log" || true
            grep -E '^audit\.onec_cards\.card=[0-9]+:[a-z0-9-]+:[a-z0-9-]+:[a-z_.]+$' "$detail_log" || true
            echo "safe_onec_cards_end"
          fi
          if [[ "${ARTISAN_ARGV[0]:-}" == "integration:sbg-site-prices" ]]; then
            echo "safe_sbg_prices_begin"
            grep -E '^metric\.sbg_prices\.[a-z_]+=[0-9]+$' "$detail_log" || true
            grep -E '^audit\.sbg_prices\.differs=[0-9]+:[a-z0-9-]+:[0-9.]+:[0-9.]+$' "$detail_log" || true
            grep -E '^audit\.sbg_prices\.site=[a-z0-9-]+:[a-z0-9-]+:[0-9.]+$' "$detail_log" || true
            grep -E '^audit\.sbg_prices\.photo=[0-9]+:[a-z0-9-]+:[0-9]+$' "$detail_log" || true
            echo "safe_sbg_prices_end"
          fi
          if [[ "${ARTISAN_ARGV[0]:-}" == "integration:create-from-sbg" ]]; then
            echo "safe_create_from_sbg_begin"
            grep -E '^metric\.create_from_sbg\.[a-z_]+=[0-9]+$' "$detail_log" || true
            grep -E '^audit\.create_from_sbg\.(card=[0-9]+:[a-z0-9-]+:[0-9.]+:[a-z0-9-]+:[0-9]+|created=[0-9]+:[0-9]+|skipped=[a-z0-9-]+:[a-z_]+)$' "$detail_log" || true
            echo "safe_create_from_sbg_end"
          fi
          if [[ "${ARTISAN_ARGV[0]:-}" == "catalog:photos-21vek" ]]; then
            echo "safe_photos_21vek_begin"
            grep -E '^metric\.photos_21vek\.[a-z_]+=[0-9]+$' "$detail_log" || true
            grep -E '^audit\.photos_21vek\.card=[0-9]+:[a-z0-9-]+:(found|none|empty):[0-9]+$' "$detail_log" || true
            echo "safe_photos_21vek_end"
          fi
          if [[ "${ARTISAN_ARGV[0]:-}" == "catalog:set-price" ]]; then
            echo "safe_set_price_begin"
            grep -E '^metric\.set_price\.[a-z_]+=[0-9]+$' "$detail_log" || true
            grep -E '^audit\.set_price\.(card=[0-9]+:[0-9.]+:[0-9.]+|skipped=[0-9]+)$' "$detail_log" || true
            echo "safe_set_price_end"
          fi
